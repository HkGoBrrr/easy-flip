name = "easyflip-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Serve only from your own domain. No *.workers.dev address (it carries your
# account's subdomain), no per-version preview URLs.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "api.easyflipestimator.com", custom_domain = true }
]

[vars]
ALLOWED_ORIGIN = "https://easyflipestimator.com,https://www.easyflipestimator.com"

# property lookups, per visitor
[[ratelimits]]
name = "PER_IP"
namespace_id = "1101"
[ratelimits.simple]
limit = 8
period = 60

# property lookups, everyone combined per Cloudflare location
[[ratelimits]]
name = "ALL_USERS"
namespace_id = "1102"
[ratelimits.simple]
limit = 20
period = 60

# autocomplete fires as people type, so it gets a looser limit
[[ratelimits]]
name = "SUGGEST_IP"
namespace_id = "1103"
[ratelimits.simple]
limit = 60
period = 60
